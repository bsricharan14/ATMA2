<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Courses</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/add_classes.css') }}"
    />
  </head>
  <body>
    <nav class="navbar">
      <h1>Institution Timetable System</h1>
      <ul>
        <li><a href="{{ url_for('index.home') }}">Home</a></li>
        <li>
          <a href="{{ url_for('semester.manage_semesters') }}"
            >Manage Semesters</a
          >
        </li>
      </ul>
    </nav>
    <div class="content-container">
      <div class="container">
        <h2>Add Courses</h2>
        <form
          action="{{ url_for('semester.add_courses', sem_id=sem_id) }}"
          method="POST"
          enctype="multipart/form-data"
        >
          <div id="course-input">
            <label>Course Name:</label>
            <input
              type="text"
              id="course_name_input"
              placeholder="Enter course name"
            />
            <br /><br />
            <label>Course Abbreviation:</label>
            <input
              type="text"
              id="course_abbr_input"
              placeholder="Enter course abbreviation"
            />
            <br /><br />
            <label>Number of Students:</label>
            <input
              type="number"
              id="num_students_input"
              placeholder="Enter number of students"
              min="1"
            />
            <br /><br />
            <label>Max Minutes per Week:</label>
            <input
              type="number"
              id="max_minutes_week_input"
              placeholder="Max minutes per week"
              min="1"
            />
            <br /><br />
            <label>Max Minutes per Day:</label>
            <input
              type="number"
              id="max_minutes_day_input"
              placeholder="Max minutes per day"
              min="1"
            />
            <br /><br />
            <label>Min Minutes per Day:</label>
            <input
              type="number"
              id="min_minutes_day_input"
              placeholder="Min minutes per day"
              min="1"
            />
            <br /><br />
            <button type="button" id="add_course_btn" class="btn">
              Add Course
            </button>
          </div>
          <div id="hidden-inputs"></div>
          <p>OR</p>
          <label for="csv_upload">Upload CSV:</label>
          <input type="file" id="csv_upload" name="csv_upload" accept=".csv" />
          <button type="submit" class="btn">Submit Courses</button>
        </form>
        <h3>Added Courses</h3>
        <table id="course-table">
          <thead>
            <tr>
              <th>Course Name</th>
              <th>Abbreviation</th>
              <th>Students</th>
              <th>Max/Week</th>
              <th>Max/Day</th>
              <th>Min/Day</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <button onclick="window.history.back()" class="btn back-btn">
          Back
        </button>
      </div>
    </div>
    <script
      src="{{ url_for('static', filename='js/add_courses.js') }}"
      )
    ></script>
  </body>
</html>
