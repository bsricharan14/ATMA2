<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Classes</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/add_classes.css') }}"
    />
  </head>
  <body>
    <nav class="navbar">
      <h1>Institution Timetable System</h1>
      <ul>
        <li><a href="{{ url_for('index.home') }}">Home</a></li>
        <li>
          <a href="{{ url_for('semester.manage_semesters') }}"
            >Manage Semesters</a
          >
        </li>
      </ul>
    </nav>

    <div class="content-container">
      <div class="container">
        <header>
          <h2>Add Classes</h2>
        </header>
        <form
          action="{{ url_for('semester.add_classes', sem_id=sem_id) }}"
          method="POST"
          enctype="multipart/form-data"
        >
          <!-- Dynamic Class Input Section -->
          <div id="class-input">
            <label>Class Name:</label>
            <input
              type="text"
              id="class_name_input"
              placeholder="Enter class name"
            />
            <label>Capacity:</label>
            <input
              type="number"
              id="capacity_input"
              placeholder="Enter capacity"
              min="1"
            />
            <button type="button" id="add_class_btn" class="btn">
              Add Class
            </button>
          </div>
          <!-- Hidden inputs container for dynamically added classes -->
          <div id="hidden-inputs"></div>
          <p>OR</p>
          <!-- CSV Upload Option -->
          <label for="csv_upload">Upload CSV :</label>
          <input type="file" id="csv_upload" name="csv_upload" accept=".csv" />
          <button type="submit" class="btn">Submit Classes</button>
        </form>
        <h3>Added Classes</h3>
        <table id="class-table">
          <thead>
            <tr>
              <th>Class Name</th>
              <th>Capacity</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <!-- Rows will be inserted here dynamically -->
          </tbody>
        </table>
        <button onclick="window.history.back()" class="btn back-btn">
          Back
        </button>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/add_classes.js') }}"></script>
  </body>
</html>
